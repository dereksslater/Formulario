<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página-formulário</title>
    <link rel="stylesheet" href="/Styles/index.css" />
    <script type="module" src="/Scripts/index.js" defer></script>
  </head>

  <body>
    <div class="container">
      <form class="formulario-conteudo">
        <h1 id="formulario-titulo">Formulário</h1>
        <label for="email">Email</label>
        <input
          id="email"
          class="input-login"
          type="email"
          placeholder="Digite seu email"
        />
        <label for="senha">Senha</label>
        <input
          id="senha"
          class="input-login"
          type="password"
          placeholder="Digite sua senha"
        />
        <h1 id="mensagem-erro"></h1>
        <button id="botao-form" type="button">Entrar</button>
      </form>
    </div>
  </body>
</html>
